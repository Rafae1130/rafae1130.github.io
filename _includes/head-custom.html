<script type="text/javascript" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  /* ------------------------------------------------------------------
     Dark glass over jekyll-theme-cayman.

     The page carries a fixed dark field lit by three coloured glows. Every
     panel above it — the article surface, code wells, callouts, buttons —
     is translucent, so the glow comes through tinted rather than being
     covered up.

     There is no backdrop-filter anywhere. It was removed on purpose: the
     backdrop here is a smooth gradient with no detail in it, so blurring
     produced almost the same pixels it started with, while forcing the
     compositor to re-filter large regions on every scroll frame. The look
     survives on translucency alone, which costs nothing to scroll.

     Loaded after the theme stylesheet, so these rules win. The syntax
     overrides near the bottom are not optional: Cayman ships GitHub's
     light Rouge palette, which is near-black on a dark well.
     ------------------------------------------------------------------ */

  :root {
    color-scheme: dark;

    --ink:        #e7eef8;
    --ink-soft:   #9db0c8;
    --ink-faint:  #7d90a8;   /* #718499 measured 4.49:1 — AA by 0.01 short */

    --accent:     #5eead4;
    --accent-hi:  #a7f3e4;

    --line:       rgba(255, 255, 255, 0.10);
    --line-hi:    rgba(255, 255, 255, 0.17);

    --glass:      rgba(255, 255, 255, 0.05);
    --glass-hi:   rgba(255, 255, 255, 0.08);
    --well:       rgba(8, 14, 26, 0.88);

    --radius:     14px;

    /* Cayman's stack starts at Consolas, which is fine on Windows but has a
       small x-height and no coverage elsewhere. These lead with the system
       UI monospace, which is what the OS already uses for code. */
    --mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono",
            "JetBrains Mono", Consolas, "Liberation Mono", Menlo, monospace;
  }

  /* Four glows, tighter than the usual corner wash and pulled in over the
     reading column rather than parked at the edges. That is deliberate:
     the article surface is a full-bleed pane of glass, so the only thing
     its backdrop-filter has to work on is how much the light behind it
     changes from place to place. Glows in the corners leave the middle —
     all of the text — sitting on flat colour.

     It sits on a fixed pseudo-element rather than on the body with
     background-attachment:fixed. The two look identical, but the attachment
     property makes the browser repaint the whole background against a new
     scroll offset every frame, and doing that underneath a full-width
     backdrop-filter is the classic way to lose frames while scrolling. A
     fixed layer is composited once and simply stays where it is. */
  body {
    background-color: #070c15;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  /* will-change forces this onto its own compositor layer. Without it the
     browser is free to keep the gradients in the same layer as the
     scrolling content, and then it has to re-rasterise four full-viewport
     radial gradients every frame to keep them looking stationary — the
     same cost background-attachment:fixed had. Promoted, it is painted
     once and simply held in place. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    will-change: transform;
    background-color: #070c15;
    background-image:
      radial-gradient(680px 460px at 26% 12%, rgba(45, 212, 191, 0.09), transparent 64%),
      radial-gradient(620px 520px at 76% 30%, rgba(99, 102, 241, 0.09), transparent 66%),
      radial-gradient(760px 520px at 42% 78%, rgba(56, 189, 248, 0.055), transparent 64%),
      radial-gradient(900px 600px at 88% 92%, rgba(168, 85, 247, 0.04), transparent 66%),
      linear-gradient(180deg, #070c15 0%, #090f1b 100%);
    background-repeat: no-repeat;
  }

  ::selection {
    background: rgba(94, 234, 212, 0.26);
    color: #ffffff;
  }

  /* ---- header ---------------------------------------------------- */

  .page-header {
    background-color: #12333c;
    /* One gradient doing the work, rather than three stops a couple of
       values apart under two glows too faint to see — that combination
       read as flat colour. It sweeps teal to blue to indigo across the
       band, then closes on #131329 so the bottom edge meets the page
       behind the article instead of ending on a seam. */
    background-image:
      linear-gradient(150deg,
        #12333c 0%,
        #122842 35%,
        #1b1d42 68%,
        #131329 100%);
    background-repeat: no-repeat;
    border-bottom: 1px solid var(--line-hi);
    padding: 5rem 1.5rem 4.5rem;
    text-align: center;
  }

  .project-name {
    margin: 0 0 0.45rem;
    color: #f4f9ff;
    font-size: 2.1rem;
    font-weight: 700;
    letter-spacing: -0.015em;
    text-shadow: 0 2px 22px rgba(0, 0, 0, 0.6);
  }
  .project-tagline {
    margin: 0 auto;
    max-width: 46rem;
    color: var(--ink-soft);
    font-size: 1rem;
    font-weight: 400;
    line-height: 1.5;
    opacity: 1;
    text-shadow: 0 1px 14px rgba(0, 0, 0, 0.5);
  }

  /* ---- the article surface ---------------------------------------- */

  /* Full-bleed, with the text centred by padding rather than a max-width,
     so the reading column has no side edges to sit against. 56rem, down
     from 60: at this size 60rem ran to about a hundred characters a line,
     which is past where the eye reliably finds the next one. Listings
     break back out to the old width below.

     The first gradient is a sheen along the top edge — the one place a
     pane of glass catches the light hardest.

     No backdrop-filter. This element is full-bleed and as tall as the
     document, and its backdrop is a fixed gradient, so the filtered region
     changed on every scroll frame and the compositor re-blurred a whole
     viewport each time. It was the single most expensive thing on the page.
     It was also buying nothing: a blur only has an effect where there is
     detail to soften, and behind this surface there is nothing but a smooth
     three-glow wash. The translucency is what carries the tint through, and
     that is free. */
  .main-content {
    max-width: none;
    width: 100%;
    margin: 0;
    padding-block: 3.5rem 3rem;
    /* Centres a 56rem column once there is room for one, and falls back to
       a gutter that grows with the viewport rather than a flat 1.25rem.
       The flat value left every window between roughly 740 and 900px with
       20px of margin, so the text ran almost edge to edge. */
    padding-inline: max(clamp(1.25rem, 5vw, 3rem), calc(50% - 28rem));
    min-height: 55vh;
    background:
      radial-gradient(120% 62% at 50% 0%, rgba(255, 255, 255, 0.075), transparent 64%),
      linear-gradient(180deg,
        rgba(255, 255, 255, 0.05),
        rgba(255, 255, 255, 0.025));
    border: 0;
    border-top: 1px solid var(--line-hi);
    border-radius: 0;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.07),
      0 -24px 60px rgba(0, 0, 0, 0.5);
    color: var(--ink);
    font-size: 1.0625rem;
    line-height: 1.75;
  }

  /* Cayman sets font-weight:normal on every heading in .main-content, which
     leaves an h3 as a slightly larger line of text and nothing more. It has
     to be restored here or the hierarchy rests entirely on size. */
  .main-content h1,
  .main-content h2,
  .main-content h3,
  .main-content h4 {
    color: #f2f8ff;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-top: 2.2em;
    margin-bottom: 0.7em;
    line-height: 1.3;
  }
  .main-content > :first-child { margin-top: 0; }

  /* A plain hairline, full width and one colour. */
  .main-content h2 {
    font-size: 1.5rem;
    padding-bottom: 0.4em;
    border-bottom: 1px solid var(--line-hi);
  }
  /* Not teal. Links and inline code are both teal already, so a teal
     heading was the third thing wearing that colour and read as a link.
     Headings are distinguished by weight and size; teal means "this is a
     link or a piece of code". */
  .main-content h3 {
    font-size: 1.25rem;
  }

  /* Underlined, because Cayman turns that off and colour alone was doing
     all the work. Teal against near-white body text is a hue difference of
     roughly 1.5:1 in lightness, which is not a reliable signal — it depends
     on the display and on the reader. An underline is a shape, so it does
     not.

     With this, every distinction on the page is carried by something other
     than colour: links are underlined, inline code sits on a chip in a mono
     face, headings are heavier and larger. Colour is now decoration on top
     of those, rather than the thing holding them apart. */
  .main-content a {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.18em;
  }
  .main-content a:hover {
    color: var(--accent-hi);
    text-decoration-thickness: 2px;
  }

  /* ---- code ------------------------------------------------------- */

  /* Nearly opaque, so a listing is read against a steady dark ground rather
     than against whatever glow happens to be behind it. No backdrop-filter
     here any more: at this alpha it bought nothing visible, and a tutorial
     that reprints a full C file at every step put a dozen full-width blur
     layers on the page for the compositor to redraw as you scrolled. */
  /* pre.highlight is named explicitly so the well outranks any `.x .highlight`
     rule that would otherwise match the pre on class count alone. */
  .main-content pre,
  .main-content pre.highlight {
    background: var(--well);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1rem 1.2rem;
    color: #d5e1ef;
    font-family: var(--mono);
    font-size: 0.9rem;
    line-height: 1.55;          /* explicit: .hll blocks align to it */
    /* A listing scrolls inside itself once it passes 85vh, so a 380 line
       driver takes up one screen of the page instead of sixteen. Reaching
       the end of the listing hands the scroll back to the page, which is
       what makes it possible to read past one without wading through it.
       Short listings are unaffected - max-height only bites above ~34 lines.
       position:relative so the jump marker can sit inside and scroll with
       the code rather than staying put while it moves. */
    position: relative;
    overflow: auto;
    max-height: 85vh;
    overscroll-behavior: auto;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.05),
      0 8px 24px rgba(0, 0, 0, 0.35);
  }
  /* Listings sit wider than the prose. A full C file reprinted at each step
     of a driver tutorial needs the room, and the offset gives code its own
     register on the page instead of tracking the paragraphs exactly. Only
     once the viewport can spare it; Rouge wraps a block three different
     ways depending on whether it came from a fence, a highlight tag or raw
     html, so all three outer shapes are named. */
  @media screen and (min-width: 64rem) {
    /* div/figure qualified, like every other .highlighter-rouge selector
       here: Kramdown puts that class on inline <code> as well, and an
       unqualified match would pull a code span sideways out of its line. */
    .main-content > pre,
    .main-content > div.highlight,
    .main-content > figure.highlight,
    .main-content > div.highlighter-rouge,
    .main-content > figure.highlighter-rouge {
      margin-left: -2rem;
      margin-right: -2rem;
    }
  }

  /* font-weight is reset here deliberately. Inline code is semibold, and
     without this line that weight inherits straight into every listing on
     the site, bolding whole files. */
  .main-content pre > code {
    background: none;
    border: 0;
    padding: 0;
    color: inherit;
    font-family: inherit;
    font-size: inherit;
    font-weight: inherit;
  }

  /* With linenos, Rouge nests a pre inside each cell of a two-column table.
     `.main-content pre` matches those too, so the gutter and the code each
     became their own padded, bordered, rounded, shadowed box with its own
     overflow — three nested boxes, and two columns whose metrics no longer
     had any reason to agree. The line numbers drifted out of step with the
     lines they number.

     The inner pres are stripped back to plain text here; only the outer
     block keeps the frame. vertical-align is set explicitly because a table
     cell defaults to baseline, which lets the two columns settle against
     each other rather than both against the top. */
  .main-content .highlight table,
  .main-content .highlight table tbody,
  .main-content .highlight table tr,
  .main-content .highlight table td {
    padding: 0;
    margin: 0;
    border: 0;
    background: none;
    vertical-align: top;
  }
  .main-content .highlight table { width: 100%; display: table; }
  .main-content .highlight table td.rouge-gutter { padding-right: 1rem; }
  .main-content .highlight table td.rouge-code   { width: 100%; }
  /* The inner pres must not scroll or clip - only the outer block does, so
     the gutter and the code stay locked together. */
  .main-content .highlight table pre {
    padding: 0;
    margin: 0;
    border: 0;
    border-radius: 0;
    background: none;
    box-shadow: none;
    overflow: visible;
    max-height: none;
    position: static;
    font-size: inherit;
    line-height: inherit;
  }
  /* A soft light chip with teal text. Both signals are mild on their own
     and the pair is what reads: the chip separates the span from the line
     by lightness, the tint says it is code rather than emphasis.

     Note the chip is only visible at all because the .highlighter-rouge
     rule further down is qualified with div/figure. Kramdown puts that
     class on inline <code> too, and unqualified it outranks this rule and
     silently removes the background.

     The pre > code reset below keeps all of this out of listings. */
  .main-content code {
    background: rgba(255, 255, 255, 0.10);
    border: 0;
    border-radius: 4px;
    padding: 0.12em 0.4em;
    color: #7fd0bd;
    font-family: var(--mono);
    font-size: 0.9em;
    font-weight: 600;
  }

  /* Lines named by mark_lines in a {% raw %}{% highlight %}{% endraw %} block, used to
     show what changed since the previous version of a listing. Amber, so a
     changed line never reads as the teal accent used everywhere else. */
  .hll {
    display: block;
    background: rgba(250, 204, 21, 0.14);
    box-shadow: inset 3px 0 0 #eab308;
    scroll-margin-top: 1.5rem;
  }

  .main-content .lineno {
    color: var(--ink-faint);
    -webkit-user-select: none;
            user-select: none;
  }

  /* ---- syntax: GitHub dark over Cayman's light Rouge palette ------- */

  /* The wrapper elements only, never the pre. Rouge paints .highlight with
     #f8f8f8, which has to go on a dark page — but in a fenced block the pre
     itself also carries class="highlight", and `.main-content .highlight`
     scores (0,2,0) against `.main-content pre` at (0,1,1). Two classes beat
     one class and an element, so a blanket rule here silently stripped the
     well off every fenced listing while bare <pre> blocks kept theirs. That
     is why some snippets were dark and some were not.

     Every one of these is qualified with div/figure for the same reason.
     Kramdown emits an inline backtick span as
     <code class="language-plaintext highlighter-rouge">, so an unqualified
     `.main-content .highlighter-rouge` also matched inline code — and at
     (0,2,0) it outranked `.main-content code` and stripped the background
     off every chip in the prose while leaving the text colour alone. */
  .main-content div.highlight,
  .main-content figure.highlight,
  .main-content div.highlighter-rouge,
  .main-content figure.highlighter-rouge { background: transparent; }

  .main-content .highlight .c,
  .main-content .highlight .c1,
  .main-content .highlight .cm,
  .main-content .highlight .cd,
  .main-content .highlight .cs { color: #76869c; font-style: italic; font-weight: 400; }

  .main-content .highlight .cp { color: #dd9a94; font-weight: 400; }

  .main-content .highlight .k,
  .main-content .highlight .kc,
  .main-content .highlight .kd,
  .main-content .highlight .kn,
  .main-content .highlight .kp,
  .main-content .highlight .kr,
  .main-content .highlight .kv,
  .main-content .highlight .o,
  .main-content .highlight .ow { color: #dd8880; font-weight: 400; }

  .main-content .highlight .kt,
  .main-content .highlight .nc,
  .main-content .highlight .nn,
  .main-content .highlight .ne { color: #d5a273; font-weight: 400; }

  .main-content .highlight .s,
  .main-content .highlight .s1,
  .main-content .highlight .s2,
  .main-content .highlight .sb,
  .main-content .highlight .sc,
  .main-content .highlight .sd,
  .main-content .highlight .se,
  .main-content .highlight .sh,
  .main-content .highlight .si,
  .main-content .highlight .sx,
  .main-content .highlight .sr,
  .main-content .highlight .ss { color: #9ec7e2; font-weight: 400; }

  .main-content .highlight .m,
  .main-content .highlight .mb,
  .main-content .highlight .mf,
  .main-content .highlight .mh,
  .main-content .highlight .mi,
  .main-content .highlight .mo,
  .main-content .highlight .mx,
  .main-content .highlight .il,
  .main-content .highlight .nb,
  .main-content .highlight .bp,
  .main-content .highlight .no,
  .main-content .highlight .na,
  .main-content .highlight .nv,
  .main-content .highlight .vc,
  .main-content .highlight .vg,
  .main-content .highlight .vi { color: #8ab4d8; font-weight: 400; }

  .main-content .highlight .nf,
  .main-content .highlight .nl,
  .main-content .highlight .nd { color: #bfa5db; font-weight: 400; }

  .main-content .highlight .nt { color: #90c69a; font-weight: 400; }

  .main-content .highlight .err { color: #dd968f; background: transparent; }
  .main-content .highlight .gd  { color: #e6c9c4; background: rgba(248, 81, 73, 0.16); }
  .main-content .highlight .gi  { color: #b6dcbb; background: rgba(63, 185, 80, 0.16); }
  .main-content .highlight .gh,
  .main-content .highlight .gu  { color: #8ab4d8; }
  .main-content .highlight .gp  { color: #76869c; }
  .main-content .highlight .go  { color: var(--ink-soft); }
  .main-content .highlight .gr,
  .main-content .highlight .gt  { color: #dd968f; }

  /* ---- tables, images, quotes ------------------------------------- */

  .main-content table {
    border-collapse: collapse;
    display: block;
    width: max-content;
    max-width: 100%;
    overflow-x: auto;
    font-size: 0.95rem;
  }
  .main-content table th {
    background: var(--glass-hi);
    color: var(--accent-hi);
    font-weight: 600;
  }
  .main-content table th,
  .main-content table td {
    border: 1px solid var(--line);
    padding: 0.5rem 0.85rem;
  }
  .main-content table tr { background: transparent; }
  .main-content table tr:nth-child(2n) { background: rgba(255, 255, 255, 0.025); }

  /* Vivado and PetaLinux captures are light-UI images. At full brightness a
     white tool window on a dark page reads as a lit panel rather than as
     part of the article, and the eye goes to it before the sentence that
     introduces it. Knocking it back a little settles it into the page;
     hover or keyboard focus restores it in full for anyone actually
     studying the screenshot, so nothing is permanently dimmed. Dark images
     barely change, since there is little brightness there to remove. */
  .main-content img {
    border-radius: 10px;
    border: 1px solid var(--line);
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.45);
    filter: brightness(0.86) saturate(0.96);
    transition: filter 0.18s ease;
  }
  .main-content img:hover,
  .main-content a:focus-visible img {
    filter: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .main-content img { transition: none; }
  }
  @media print {
    .main-content img { filter: none; }
  }

  .main-content blockquote {
    color: var(--ink-soft);
    border-left: 4px solid rgba(94, 234, 212, 0.4);
    padding-left: 1rem;
  }

  .main-content hr {
    height: 0;
    background: none;
    border: 0;
    border-top: 1px solid var(--line-hi);
  }

  /* ---- footer ----------------------------------------------------- */

  .site-footer {
    margin-top: 3rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--line);
    color: var(--ink-faint);
    font-size: 0.85rem;
  }
  .site-footer a { color: var(--accent); }
  .site-footer a:hover { color: var(--accent-hi); }

  /* ---- existing components ---------------------------------------- */

  .tip-box {
    background: var(--glass);
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 0 10px 10px 0;
    padding: 12px 16px;
    margin: 1.25em 0;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }
  .tip-box > :first-child { margin-top: 0; }
  .tip-box > :last-child { margin-bottom: 0; }

  .post-nav {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    margin: 3em 0 1em;
    padding-top: 1.25em;
    border-top: 1px solid var(--line);
  }
  .post-nav .nav-prev { grid-column: 1; justify-self: start; }
  .post-nav .nav-home { grid-column: 2; justify-self: center; }
  .post-nav .nav-next { grid-column: 3; justify-self: end; }
  .post-nav a {
    display: inline-block;
    padding: 8px 16px;
    background: var(--glass);
    border: 1px solid var(--line-hi);
    border-radius: 8px;
    color: var(--accent);
    text-decoration: none;
    font-size: 0.95em;
    line-height: 1.2;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .post-nav a:hover {
    background: rgba(94, 234, 212, 0.16);
    border-color: rgba(94, 234, 212, 0.45);
    color: var(--accent-hi);
  }

  /* ---- scrollbars -------------------------------------------------- */

  * { scrollbar-color: rgba(255, 255, 255, 0.22) transparent; }
  .main-content pre::-webkit-scrollbar,
  .main-content table::-webkit-scrollbar { height: 10px; }
  .main-content pre::-webkit-scrollbar-thumb,
  .main-content table::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.18);
    border-radius: 6px;
  }
  .main-content pre::-webkit-scrollbar-track,
  .main-content table::-webkit-scrollbar-track { background: transparent; }

  /* Anchor jumps — into a mark_lines block, say — glide rather than cut.
     The wheel handler at the end of this file passes behavior:'instant',
     so it never compounds with this. */
  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }

  /* ---- narrow screens --------------------------------------------- */

  @media screen and (max-width: 46rem) {
    .page-header { padding: 2.75rem 1.25rem 2.5rem; }
    .project-name { font-size: 1.6rem; }
    .project-tagline { font-size: 0.95rem; }
    .main-content {
      padding-block: 2rem 2.5rem;   /* gutter comes from the rule above */
      font-size: 1rem;
    }
    .main-content pre { font-size: 0.8rem; }
  }
</style>

<script>
{% raw %}
/* Inertial wheel scroll.

   Three things sank the earlier attempts at this, and all three are fixed
   here rather than retuned:

   1. The easing was a fixed fraction per frame, so it converged faster on a
      144Hz panel than a 60Hz one and lurched whenever a frame ran late. It
      is now applied against real elapsed time.
   2. It closed the last few pixels asymptotically, which reads as lag at
      the end of every scroll. It now snaps once the gap is under 1.5px.
   3. It competed for the main thread with a full-width backdrop-filter that
      re-blurred a whole viewport every frame. Those are gone from the
      stylesheet entirely, which is the change that makes this viable at
      all.

   Readers who have asked for reduced motion keep native scrolling. */
(function () {
  'use strict';

  var doc   = document.documentElement;
  var FRAME = 1000 / 60;

  /* Quoted per 60Hz frame. Lower means a longer glide, so both values move
     together to change how much smoothing there is; the ratio between them
     is what makes a nudge and a flick feel different. Too wide a spread and
     short scrolls snap hard enough to read as the steppiness this is meant
     to remove, which is why they are not simply halved. */
  var EASE_NEAR   = 0.125;
  var EASE_FAR    = 0.062;
  var SNAP        = 1.5;   /* px left before we just land */
  var MAX_PENDING = 2;     /* viewports of banked travel */

  var target = 0, cur = 0, running = false, last = 0;
  var dpr = window.devicePixelRatio || 1;

  function maxScroll() {
    return Math.max(0, doc.scrollHeight - window.innerHeight);
  }

  /* A wide listing scrolls itself sideways, but deltaY over one still
     belongs to the page. Only a box that can genuinely move vertically gets
     the event back; the hop limit keeps this off the critical path. */
  function scrollsVertically(node) {
    var hops = 0;
    while (node && node !== document.body && node.nodeType === 1 && hops++ < 12) {
      var s = window.getComputedStyle(node);
      if ((s.overflowY === 'auto' || s.overflowY === 'scroll') &&
          node.scrollHeight > node.clientHeight + 1) { return true; }
      node = node.parentNode;
    }
    return false;
  }

  function place(y) {
    /* Land on a device pixel. Fractional offsets round unevenly frame to
       frame, and at low speed that unevenness is exactly what reads as
       stutter. 'instant' so this never compounds with scroll-behavior. */
    window.scrollTo({ top: Math.round(y * dpr) / dpr, left: window.scrollX, behavior: 'instant' });
  }

  function tick(now) {
    var dt = last ? Math.min(now - last, 64) : FRAME;
    last = now;

    var gap  = target - cur;
    var dist = Math.abs(gap);

    if (dist < SNAP) {
      cur = target; running = false; last = 0;
      place(cur);
      return;
    }

    var k    = Math.min(1, dist / Math.max(1, window.innerHeight));
    var ease = EASE_NEAR + (EASE_FAR - EASE_NEAR) * k;
    cur += gap * Math.min(1, 1 - Math.pow(1 - ease, dt / FRAME));

    place(cur);
    requestAnimationFrame(tick);
  }

  function onWheel(e) {
    if (e.ctrlKey || e.altKey || e.shiftKey || e.defaultPrevented) { return; }
    if (scrollsVertically(e.target)) { return; }

    var end = maxScroll();
    if (end <= 0) { return; }

    var d = e.deltaY;
    if (e.deltaMode === 1) { d *= 18; }
    else if (e.deltaMode === 2) { d *= window.innerHeight; }
    if (!d) { return; }

    e.preventDefault();
    var cap = MAX_PENDING * window.innerHeight;
    target = Math.max(cur - cap, Math.min(cur + cap, target + d));
    target = Math.max(0, Math.min(end, target));
    if (!running) { running = true; last = 0; requestAnimationFrame(tick); }
  }

  function resync() {
    if (!running) { target = cur = window.scrollY; }
  }

  function start() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { return; }
    target = cur = window.scrollY;

    /* Keyboard, scrollbar drag, find-in-page and anchor jumps all land here;
       resyncing stops the next wheel event yanking back to a stale target. */
    window.addEventListener('scroll', resync, { passive: true });
    window.addEventListener('resize', function () {
      dpr = window.devicePixelRatio || 1;
      resync();
    }, { passive: true });
    window.addEventListener('wheel', onWheel, { passive: false });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
{% endraw %}
</script>

<style>
  /* Copy and download sit over the top right of a listing. They are added to
     the wrapper, not to the pre, so they stay put while the code scrolls
     underneath them. */
  .main-content div.highlighter-rouge,
  .main-content div.highlight { position: relative; }

  .code-tools {
    position: absolute;
    top: 0.5rem;
    right: 0.6rem;
    z-index: 3;
    display: flex;
    gap: 6px;
    /* faint but present, rather than hidden until hover: a control nobody
       knows is there is the same as no control */
    opacity: 0.4;
    transition: opacity 0.15s ease;
  }
  .main-content div.highlighter-rouge:hover .code-tools,
  .main-content div.highlight:hover .code-tools,
  .code-tools:focus-within { opacity: 1; }

  .code-tools button {
    font: 600 11px/1 var(--mono);
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    background: rgba(255, 255, 255, 0.10);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 5px;
    padding: 5px 9px;
    cursor: pointer;
  }
  .code-tools button:hover {
    color: var(--ink);
    border-color: rgba(255, 255, 255, 0.3);
    background: rgba(255, 255, 255, 0.16);
  }
  .code-tools button.done {
    color: #0d1420;
    background: var(--accent);
    border-color: var(--accent);
  }
  @media print { .code-tools { display: none; } }
</style>

<script>
{% raw %}
/* Copy and download buttons on every listing.
 *
 * The code text is read from the code cell only, so line numbers never end
 * up on the clipboard. Nothing here rewrites the highlighted markup - the
 * buttons are appended to the wrapper as a sibling of the pre, because
 * touching the pre's innerHTML re-parses Rouge's output and breaks it. */
(function () {
  var EXT = { c: 'c', cpp: 'cpp', dts: 'dts', verilog: 'v', vhdl: 'vhd',
              bash: 'sh', shell: 'sh', python: 'py', tcl: 'tcl',
              makefile: 'mk', plaintext: 'txt', text: 'txt' };

  function codeOf(box) {
    var cell = box.querySelector('td.rouge-code') || box.querySelector('td.code');
    var pre  = cell ? cell.querySelector('pre') || cell : box.querySelector('pre');
    return pre ? pre.innerText.replace(/\s+$/, '') + '\n' : '';
  }

  function nameOf(box, i) {
    var lang = (box.className.match(/language-(\w+)/) || [])[1] || 'plaintext';
    var host = box.closest('div.listing');
    var stem = host ? host.id.replace(/^ls-/, '') : ('snippet-' + i);
    var page = (location.pathname.split('/').pop() || 'listing').replace(/\.html?$/, '');
    return page + '-' + stem + '.' + (EXT[lang] || 'txt');
  }

  function flash(btn, text) {
    var was = btn.textContent;
    btn.textContent = text;
    btn.classList.add('done');
    setTimeout(function () { btn.textContent = was; btn.classList.remove('done'); }, 1400);
  }

  function dress() {
  var blocks = document.querySelectorAll('.main-content div.highlighter-rouge, .main-content div.highlight');
  blocks.forEach(function (box, i) {
    /* a rouge wrapper contains a highlight div; only dress the outermost */
    if (box.parentElement && box.parentElement.closest('div.highlighter-rouge')) { return; }
    if (!box.querySelector('pre')) { return; }

    var tools = document.createElement('div');
    tools.className = 'code-tools';

    var copy = document.createElement('button');
    copy.type = 'button';
    copy.textContent = 'copy';
    copy.addEventListener('click', function () {
      var text = codeOf(box);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { flash(copy, 'copied'); },
                                                 function () { flash(copy, 'failed'); });
      } else {
        /* file:// and older browsers have no async clipboard */
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); flash(copy, 'copied'); }
        catch (e) { flash(copy, 'failed'); }
        ta.remove();
      }
    });

    var dl = document.createElement('button');
    dl.type = 'button';
    dl.textContent = 'download';
    dl.addEventListener('click', function () {
      var blob = new Blob([codeOf(box)], { type: 'text/plain;charset=utf-8' });
      var url  = URL.createObjectURL(blob);
      var a    = document.createElement('a');
      a.href = url;
      a.download = nameOf(box, i);
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      flash(dl, 'saved');
    });

    tools.appendChild(copy);
    tools.appendChild(dl);
    box.appendChild(tools);
  });
  }

  /* This file is included from <head>, so the listings do not exist yet when
     it runs. Without waiting, querySelectorAll matches nothing and no button
     is ever added. */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', dress);
  } else {
    dress();
  }
})();
{% endraw %}
</script>
