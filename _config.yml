title: FPGA Design Notes
description: Notes and blogs on FPGA design, timing analysis, and digital architectures
theme: jekyll-theme-cayman

url: https://rafae1130.github.io
# Empty rather than absent: a user page is served from the domain root, and
# stating it stops anything downstream from supplying a baseurl of its own.
baseurl: ""
lang: en_GB
author: Abdur Rafae Haqqani

# Used by _layouts/default.html for the header button and footer line.
repository: Rafae1130/rafae1130.github.io

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  # These five came free with the github-pages gem. The site relies on
  # them: no file here has front matter, and README.md is the homepage.
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-titles-from-headings
  - jekyll-default-layout

# Jekyll 4 emits a Sass source map by default; the site has no use for it.
sass:
  sourcemap: never

# github.io cannot use DNS verification, so ownership is proved with the
# meta tag these emit. Add `bing:` here too if not importing from Google.
webmaster_verifications:
  google: 5_1qoztSE6XmUjmrQBgiNAAYoV3jSTKAqH32CqnnIfQ

# jekyll-seo-tag reads page.image, never site.image, so the social card
# and the per-series descriptions are injected as page defaults.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/social-card.png

  - scope:
      path: "posts/timing_analysis"
    values:
      description: >-
        Understanding FPGA timing analysis in Vivado: setup and hold checks,
        slack, clock skew, pessimism removal, and reg-to-pin paths.

  - scope:
      path: "posts/CDC"
    values:
      description: >-
        Clock domain crossing in FPGA design: reading report_cdc, single-bit
        synchronizers, and safe multi-bit CDC structures.

  - scope:
      path: "posts/embedded_linux"
    values:
      description: >-
        Embedded Linux on the Zynq SoC: device tree, overlays, UIO, and
        writing Linux device drivers for custom PL IP.

  - scope:
      path: "posts/on-request"
    values:
      description: >-
        Reducing quantization error in FPGA DSP: rounding, dither, noise
        shaping, saturation, and block floating point.

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - posts/embedded_linux/generate_part2_figures.py
